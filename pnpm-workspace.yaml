allowBuilds:
  '@parcel/watcher': true
  pandora-common: true
  pandora-common@git+https://github.com/Project-Pandora-Game/pandora.git: true
  sharp: true
  unrs-resolver: true

allowUnusedPatches: false
injectWorkspacePackages: false
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - pandora-common
  # Renovate security update: simple-git@4.0.1
  - simple-git@4.0.1
nodeOptions: --no-warnings=ExperimentalWarning --experimental-vm-modules
autoInstallPeers: false
strictPeerDependencies: true
updateNotifier: false
verifyDepsBeforeRun: install
trustLockfile: true
